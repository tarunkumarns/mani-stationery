<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="100%" height="100%">
  <!-- Background: Rich warm chocolate brown matching official logo image -->
  <rect width="640" height="320" rx="32" fill="#4e2d1d" />

  <!-- Rounded Square Tile for Pencil Icon -->
  <g transform="translate(60, 48)">
    <rect width="224" height="224" rx="36" fill="#5f3521" />
    
    <!-- Golden Minimalist Pencil Icon -->
    <g transform="translate(62, 36)">
      <!-- Pencil Body with Rounded Top -->
      <path 
        d="M20 28 C20 14, 34 8, 50 8 C66 8, 80 14, 80 28 L80 92 C80 95, 78 98, 74 98 C70 98, 66 94, 62 98 C58 102, 54 98, 50 98 C46 98, 42 102, 38 98 C34 94, 30 98, 26 98 C22 98, 20 95, 20 92 Z" 
        fill="none" 
        stroke="#e5aa4b" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
      />
      
      <!-- Inner Vertical Flutes -->
      <line x1="40" y1="12" x2="40" y2="96" stroke="#e5aa4b" stroke-width="4.5" stroke-linecap="round" />
      <line x1="60" y1="12" x2="60" y2="96" stroke="#e5aa4b" stroke-width="4.5" stroke-linecap="round" />
      
      <!-- Collar Divider Band -->
      <line x1="20" y1="32" x2="80" y2="32" stroke="#e5aa4b" stroke-width="4" />
      
      <!-- Sharpened Triangular Cone -->
      <path d="M22 100 L50 144 L78 100" fill="none" stroke="#e5aa4b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Lead Tip Solid Triangle -->
      <polygon points="40,128 50,144 60,128" fill="#e5aa4b" />
    </g>
  </g>

  <!-- Typography: Pure Cream Sans-serif Wordmark -->
  <g transform="translate(320, 150)">
    <text 
      x="0" 
      y="0" 
      font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
      font-size="94" 
      font-weight="900" 
      fill="#f8ede2" 
      letter-spacing="-1px"
    >
      Mani
    </text>
    <text 
      x="0" 
      y="84" 
      font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
      font-size="78" 
      font-weight="800" 
      fill="#f8ede2" 
      letter-spacing="-0.5px"
    >
      Stationery
    </text>
  </g>
</svg>
